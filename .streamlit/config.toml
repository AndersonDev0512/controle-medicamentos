[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#061329"
secondaryBackgroundColor = "#0B1730"
textColor = "#FFFFFF"
linkColor = "#60A5FA"
borderColor = "#1E3A66"
dataframeBorderColor = "#1E3A66"
dataframeHeaderBackgroundColor = "#0F1F3D"
font = "sans-serif"
baseRadius = "10px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0B1730"
secondaryBackgroundColor = "#0F1F3D"
textColor = "#FFFFFF"
borderColor = "#1E3A66"

[server]
# Serve a pasta static/ em app/static/ (imagens do hero e do fundo)
enableStaticServing = true
