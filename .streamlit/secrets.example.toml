# Exemplo de secrets.toml para desenvolvimento local
# Copie este arquivo para .streamlit/secrets.toml (NÃO comitar o arquivo final com credenciais)

# Cole o JSON completo da Service Account entre triple-quotes
# Exemplo:
# gcp_service_account = '''
# {"type": "service_account", "project_id": "...", "private_key": "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n", "client_email": "...@...iam.gserviceaccount.com", ...}
# '''

gcp_service_account = '''
{
  "type": "service_account",
  "project_id": "SEU_PROJECT_ID",
  "private_key_id": "SEU_PRIVATE_KEY_ID",
  "private_key": "-----BEGIN PRIVATE KEY-----\nSEU_PRIVATE_KEY\n-----END PRIVATE KEY-----\n",
  "client_email": "SEU_CLIENT_EMAIL@...iam.gserviceaccount.com",
  "client_id": "SEU_CLIENT_ID"
}
'''

SPREADSHEET_ID = "SUA_SPREADSHEET_ID_OU_URL"
